  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Dependency caching is OPT-IN, not defaulted: `cache: npm` hard-fails
      # when package-lock.json is absent, and this template is stamped into
      # repos whose lockfile situation is unknown. Add it once the lockfile is
      # committed:
      #   with:
      #     node-version: lts/*
      #     cache: npm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
      # `npm install`, NOT `npm ci`: target repos frequently carry lockfile
      # drift, and `npm ci` hard-fails on any drift — turning "deps drifted"
      # into a misleading red build. Keep this in lockstep with
      # templates/pre-merge-check.sh, which documents the same decision.
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint --if-present
      - name: Build
        run: npm run build --if-present
      - name: Test
        run: npm test
